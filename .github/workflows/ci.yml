name: ci

# ClipBridge 扁平多任务 CI（契约见 docs/ci-architecture.md）。
# 分类只由 scripts/ci/plan.psm1 + get-plan.ps1 产生一个结构化 plan；
# 每个 job 的 if 读取 plan.required，ci-result 用同一 plan 与 needs 实际结果核对。
# 本地渠道（MSIX / Store 上传 / winget）不进入本工作流，也不上传其产物。

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# fork PR 只读：普通 CI 不使用 secrets、不申请写权限、不发布 Release。
permissions:
  contents: read

# PR 新提交取消同 PR 的过时验证；main push 与手动全量不取消正在执行的验证。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      diff-base: ${{ steps.range.outputs.diff-base }}
      diff-head: ${{ steps.range.outputs.diff-head }}
      diff-ok: ${{ steps.range.outputs.diff-ok }}
    steps:
      - name: Checkout (full history for merge-base diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # PR 使用与目标分支的合并基点；main push 覆盖整个 push 范围。
      # 所有事件值通过 env 传入，不拼进可执行 shell 源码。
      - name: Resolve diff range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$BASE_REF" ]; then
              if git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
                base="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA" || true)"
              fi
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              base="$BEFORE_SHA"
            fi
          fi
          ok=false
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            ok=true
          else
            base=""
          fi
          {
            echo "diff-base=$base"
            echo "diff-head=$HEAD_SHA"
            echo "diff-ok=$ok"
          } >> "$GITHUB_OUTPUT"

      - name: Compute structured plan
        id: plan
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DIFF_OK: ${{ steps.range.outputs.diff-ok }}
          DIFF_BASE: ${{ steps.range.outputs.diff-base }}
          DIFF_HEAD: ${{ steps.range.outputs.diff-head }}
        run: |
          $arguments = @{
            Commit     = $env:HEAD_SHA
            OutFile    = (Join-Path $env:RUNNER_TEMP 'ci-plan.json')
            VerifyHead = $true
          }
          if ($env:DIFF_OK -eq 'true') {
            $arguments.DiffBase = $env:DIFF_BASE
            $arguments.DiffHead = $env:DIFF_HEAD
          } else {
            $arguments.Scope = 'full'
            $arguments.FullReason = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              'manual full validation requested'
            } else {
              'diff unavailable or empty base; conservative full validation'
            }
          }
          ./scripts/ci/get-plan.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "get-plan.ps1 failed (exit $LASTEXITCODE)" }
          $planPath = Join-Path $env:RUNNER_TEMP 'ci-plan.json'
          if (-not (Test-Path -LiteralPath $planPath -PathType Leaf)) {
            throw "get-plan.ps1 did not write a plan: $planPath"
          }
          $json = [System.IO.File]::ReadAllText($planPath)
          $delimiter = 'CLIPBRIDGE_PLAN_' + [guid]::NewGuid().ToString('N')
          "plan<<$delimiter" | Add-Content -Path $env:GITHUB_OUTPUT
          $json | Add-Content -Path $env:GITHUB_OUTPUT
          $delimiter | Add-Content -Path $env:GITHUB_OUTPUT

  ci-config:
    needs: changes
    if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).required['ci-config'] == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for changed-doc links)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 固定版本 + 官方发布 SHA256；不执行被检查的业务命令。
      - name: Download actionlint 1.7.12 (pinned + SHA256)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-tools/actionlint"
          curl -fsSL --retry 2 --retry-delay 2 \
            -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/ci-tools/actionlint"
          "$RUNNER_TEMP/ci-tools/actionlint/actionlint" -version

      # actionlint + PowerShell AST + bash -n + 修改文档的本地链接 + workflow 结构契约。
      - name: Lightweight CI configuration checks
        shell: pwsh
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          DIFF_OK: ${{ needs.changes.outputs.diff-ok }}
          DIFF_BASE: ${{ needs.changes.outputs.diff-base }}
          DIFF_HEAD: ${{ needs.changes.outputs.diff-head }}
          ACTIONLINT: ${{ runner.temp }}/ci-tools/actionlint/actionlint
        run: |
          ./scripts/ci/check-config.ps1 `
            -PlanJson $env:CI_PLAN `
            -BaseSha $env:DIFF_BASE `
            -HeadSha $env:DIFF_HEAD `
            -DiffOk $env:DIFF_OK `
            -ActionlintPath $env:ACTIONLINT

      # 分类/汇总与平台轻量契约测试每次运行。
      - name: Plan and aggregation contract tests
        shell: pwsh
        run: ./scripts/ci/test-plan.ps1

      - name: Rust report contract tests
        shell: pwsh
        run: ./scripts/ci/test-rust-report.ps1

      - name: Windows report contract tests
        shell: pwsh
        run: ./scripts/ci/test-windows-report.ps1

      - name: Packaging and release contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./scripts/ci/test-packaging.ps1
          if ($LASTEXITCODE -ne 0) { throw 'packaging contract tests failed' }
          foreach ($name in @('test-release-model.ps1', 'test-release-github-api.ps1', 'test-release-candidate.ps1', 'test-release-workflow.ps1')) {
            $path = Join-Path ./scripts/ci $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing required contract suite: $name" }
            pwsh -NoProfile -File $path
            if ($LASTEXITCODE -ne 0) { throw "release contract test failed: $name" }
          }

      - name: Android and macOS lightweight contract tests
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/ci/android/tests/run-tests.sh
          test -f scripts/ci/macos/tests/run-tests.sh
          bash scripts/ci/android/tests/run-tests.sh
          bash scripts/ci/macos/tests/run-tests.sh

  rust:
    needs: changes
    if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).required['rust'] == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-rust

      # 单一入口：格式化、clippy、测试、FFI surface、固定版本 cargo-deny、报告核验。
      - name: Rust validation and reports
        shell: pwsh
        run: ./scripts/ci/rust.ps1 -OutDir "$env:RUNNER_TEMP/ci-logs/rust"

      - name: Upload Rust logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-rust-x64-${{ github.sha }}
          # 白名单：不把 OutDir/tools 下的 cargo-deny 等工具二进制塞进 artifact。
          path: |
            ${{ runner.temp }}/ci-logs/rust/**/*.log
            ${{ runner.temp }}/ci-logs/rust/**/*summary*.json
            ${{ runner.temp }}/ci-logs/rust/**/*-report*.json
            ${{ runner.temp }}/ci-logs/rust/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  windows:
    needs: changes
    if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).required['windows'] == true
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # WinUI shell 的 BeforeBuild 会构建 core-ffi-windows；缓存 Rust 依赖产物，
      # 但工作区 crate 仍按当前源码重编（缓存命中不等于源码构建通过）。
      - name: Cache cargo (rust-cache, Windows native)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-native

      # 单一入口：Rust DLL、Release/x64/win-x64/R2R 的 restore/format/build/test、TRX 与 summary。
      - name: Windows native integration and MSTest
        shell: pwsh
        run: ./scripts/ci/windows.ps1 -OutDir "$env:RUNNER_TEMP/ci-logs/windows"

      - name: Upload Windows logs, TRX and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-windows-x64-${{ github.sha }}
          # 只上传报告/日志；排除临时 tools 等构建树内容。
          path: |
            ${{ runner.temp }}/ci-logs/windows/**/*.log
            ${{ runner.temp }}/ci-logs/windows/**/*summary*.json
            ${{ runner.temp }}/ci-logs/windows/**/*-report*.json
            ${{ runner.temp }}/ci-logs/windows/**/*.trx
            ${{ runner.temp }}/ci-logs/windows/**/*.txt
          if-no-files-found: warn
          retention-days: 14

  android:
    needs: changes
    if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).required['android'] == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # v3.2.2 默认安装 tools platform-tools；Google 已移除 tools 包。
      # 此 action 仅提供 sdkmanager/接受 licenses，项目固定包由下一步显式安装。
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''

      # 平台入口自行严格校验版本，不自动安装 SDK；工作流在入口前显式安装项目固定的
      # platform/build-tools/NDK/CMake。licenses 处理有界（timeout），真正的门禁是随后的
      # sdkmanager --install：license 缺失会在这里 fail closed。
      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 120 bash -c 'yes | sdkmanager --licenses >/dev/null 2>&1'; then
            echo "sdkmanager --licenses did not complete cleanly; continuing to the install gate" >&2
          fi
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Add Rust Android targets
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android x86_64-linux-android

      # 单一入口：SDK/NDK/CMake 版本核对、双 ABI SO、Gradle debug APK、包内容与签名范围检查。
      - name: Android build and package contract
        shell: bash
        run: bash scripts/ci/android.sh "$RUNNER_TEMP/ci-logs/android"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk-arm64_x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/ci-logs/android/android-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-android-x64-${{ github.sha }}
          # 只上传日志/报告/文本证据；APK、SO、tools 扫描器不在 logs artifact 中。
          path: |
            ${{ runner.temp }}/ci-logs/android/**/*.log
            ${{ runner.temp }}/ci-logs/android/**/*summary*.json
            ${{ runner.temp }}/ci-logs/android/**/*check*.json
            ${{ runner.temp }}/ci-logs/android/**/*.txt
          if-no-files-found: warn
          retention-days: 14

  macos:
    needs: changes
    if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).required['macos'] == true
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify pinned Xcode 26.0.1
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "missing pinned Xcode toolchain: $DEVELOPER_DIR" >&2
            exit 1
          fi
          xcodebuild -version

      # 单一入口：当前源码 dylib、真实 Xcode target/scheme、嵌入与动态加载/ABI 探测。
      - name: macOS Xcode build and probe
        shell: bash
        run: bash scripts/ci/macos.sh "$RUNNER_TEMP/ci-logs/macos"

      - name: Upload macOS app bundle (test artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app-release-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/ci-logs/macos/ClipBridge-app-release-arm64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-macos-arm64-${{ github.sha }}
          # 只上传日志/报告/文本证据；DerivedData、.app、dylib 和 app zip 不在这里。
          path: |
            ${{ runner.temp }}/ci-logs/macos/**/*.log
            ${{ runner.temp }}/ci-logs/macos/**/*summary*.json
            ${{ runner.temp }}/ci-logs/macos/**/*check*.json
            ${{ runner.temp }}/ci-logs/macos/**/*.txt
            ${{ runner.temp }}/ci-logs/macos/xcodebuild-list.json
          if-no-files-found: warn
          retention-days: 14

  windows-packages:
    needs: [ changes, windows ]
    if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).required['windows-packages'] == true
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # 包构建同样从当前源码构建 Rust DLL；缓存依赖产物，不把缓存命中当源码成功。
      - name: Cache cargo (rust-cache, Windows packages)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-packages

      - name: Download and verify WiX 3.14.1
        id: wix
        shell: pwsh
        run: ./scripts/ci/setup-wix.ps1 -DestDir "$env:RUNNER_TEMP/wix314"

      # 只构建 plan.packages 指定格式；package-summary.json 的 role=release 才是上传白名单，
      # role=internal（user MSI 载荷）只作为诊断 artifact。
      - name: Build selected Windows packages
        id: packages
        shell: pwsh
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          WIX_PATH: ${{ steps.wix.outputs.wix-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = $env:CI_PLAN | ConvertFrom-Json -Depth 16
          $formats = @($plan.packages)
          if ($formats.Count -eq 0) { throw 'windows-packages was scheduled but plan.packages is empty' }
          foreach ($format in $formats) {
            if ($format -notin @('machine-msi', 'user-exe', 'portable-zip')) {
              throw "unsupported package format from plan: $format"
            }
          }
          Write-Host "formats: $($formats -join ', ')"
          & ./scripts/build-windows-installers.ps1 -Formats $formats -OutDir dist -WixInstallPath $env:WIX_PATH
          if (-not $?) { throw 'build-windows-installers.ps1 failed' }

          $summaryPath = Join-Path 'dist' 'package-summary.json'
          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) {
            throw "missing package summary: $summaryPath"
          }
          $summary = [System.IO.File]::ReadAllText($summaryPath) | ConvertFrom-Json -Depth 16
          if ([int]$summary.schemaVersion -ne 1) { throw "unsupported package summary schemaVersion: $($summary.schemaVersion)" }
          if ([string]$summary.product -ne 'ClipBridge') { throw "unexpected package summary product: $($summary.product)" }
          if ([string]$summary.platform -ne 'x64') { throw "unexpected package summary platform: $($summary.platform)" }

          $summaryFormats = @($summary.formats | ForEach-Object { [string]$_ })
          if ((($summaryFormats | Sort-Object) -join ',') -ne (($formats | Sort-Object) -join ',')) {
            throw "package summary formats do not match plan.packages: [$($summaryFormats -join ',')] vs [$($formats -join ',')]"
          }

          $artifacts = @($summary.artifacts)
          $release = @($artifacts | Where-Object { [string]$_.role -eq 'release' })
          $internal = @($artifacts | Where-Object { [string]$_.role -eq 'internal' })
          foreach ($artifact in $artifacts) {
            $role = [string]$artifact.role
            if ($role -notin @('release', 'internal')) { throw "unknown artifact role: $role" }
            $name = [string]$artifact.name
            if ([string]::IsNullOrWhiteSpace($name) -or $name -match '[\\/]' -or $name -match '\.\.') {
              throw "invalid artifact name in package summary: $name"
            }
            $isInternal = [bool]$artifact.internal
            if (($role -eq 'internal') -ne $isInternal) { throw "artifact '$name' role/internal flag disagree" }
            $path = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "declared artifact is missing: $path" }
            $item = Get-Item -LiteralPath $path
            if ([int64]$artifact.size -ne $item.Length) { throw "artifact size mismatch for $name" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($hash -ine [string]$artifact.sha256) { throw "artifact sha256 mismatch for $name" }
          }
          if ($release.Count -ne $formats.Count) {
            throw "expected exactly one release artifact per planned format; got $($release.Count) release and $($formats.Count) formats"
          }
          foreach ($format in $formats) {
            $matches = @($release | Where-Object { [string]$_.format -eq $format })
            if ($matches.Count -ne 1) { throw "expected exactly one release artifact for format $format" }
          }

          $releasePaths = @($release | ForEach-Object { Join-Path 'dist' ([string]$_.name) })
          $internalPaths = @($internal | ForEach-Object { Join-Path 'dist' ([string]$_.name) })
          $releaseDelimiter = 'RELEASE_PATHS_' + [guid]::NewGuid().ToString('N')
          $internalDelimiter = 'INTERNAL_PATHS_' + [guid]::NewGuid().ToString('N')
          "release-paths<<$releaseDelimiter" | Add-Content -Path $env:GITHUB_OUTPUT
          $releasePaths | Add-Content -Path $env:GITHUB_OUTPUT
          $releaseDelimiter | Add-Content -Path $env:GITHUB_OUTPUT
          "internal-paths<<$internalDelimiter" | Add-Content -Path $env:GITHUB_OUTPUT
          $internalPaths | Add-Content -Path $env:GITHUB_OUTPUT
          $internalDelimiter | Add-Content -Path $env:GITHUB_OUTPUT

          $logDir = Join-Path $env:RUNNER_TEMP 'ci-logs/windows-packages'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Copy-Item -LiteralPath $summaryPath -Destination (Join-Path $logDir 'package-summary.json') -Force

      - name: Upload selected installers (release artifacts only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages-x64-${{ github.sha }}
          path: ${{ steps.packages.outputs.release-paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload internal user MSI (diagnostic only)
        if: steps.packages.outputs.internal-paths != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages-diagnostic-x64-${{ github.sha }}
          path: ${{ steps.packages.outputs.internal-paths }}
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload Windows packaging logs and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-windows-packages-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-logs/windows-packages/**/*summary*.json
            ${{ runner.temp }}/ci-logs/windows-packages/**/*.log
            ${{ runner.temp }}/ci-logs/windows-packages/**/*.txt
          if-no-files-found: warn
          retention-days: 14

  ci-result:
    needs: [ changes, ci-config, rust, windows, android, macos, windows-packages ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify results and write GITHUB_STEP_SUMMARY
        if: always()
        shell: pwsh
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./scripts/ci/assert-result.ps1
