name: release-please

# Version/changelog automation only. skip-github-release is set both in the
# config and as the action input so this workflow can never create a GitHub
# Release or its tag. Windows binary publication belongs exclusively to the
# manual "Release Windows" workflow.
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          manifest-file: release-please-manifest.json
          config-file: release-please-config.json
          skip-github-release: true
