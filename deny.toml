# ===============================
# cargo-deny configuration
# ===============================

# ---- Security advisories ----
[advisories]
# cargo-deny 0.19+ 的配置版本；旧键 severity-threshold 已被移除
version = 2
# Warn if a crate is yanked
yanked = "warn"
# Do not ignore any advisories
ignore = []

# ---- License checking ----
[licenses]
version = 2

# Common permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # unicode-ident >= 1.0.27 bundles Unicode tables under Unicode-3.0 (OSI approved)
    "Unicode-3.0"
]

# Weak copyleft: 不在 allow 列表内的许可证会被拒绝（比原来的 warn 更严格，但配置更简单）
# Confidence level for license detection
confidence-threshold = 0.8

# 工作区内的私有 crate 不强制 license 元数据（第三方 crate 仍然强制）
# 后续建议：给四个 crate 的 manifest 加 `license.workspace = true`
[licenses.private]
ignore = true

# ---- Dependency bans ----
[bans]
# Allow version ranges (caret, tilde, etc.)
wildcards = "allow"

# Multiple versions are common in Rust; warn only
multiple-versions = "warn"

# Explicitly deny certain crates if ever pulled in
deny = []

# ---- Source control ----
[sources]
# Only allow crates from crates.io
unknown-registry = "deny"

# Git dependencies are allowed but should be reviewed
# 注意：cargo-deny 0.19+ 把该键从 `git` 改名为 `unknown-git`；
# 旧键会让整个配置反序列化失败（gate 直接崩，而不是报告问题），所以必须用新键。
unknown-git = "warn"
