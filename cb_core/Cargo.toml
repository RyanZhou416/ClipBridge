#cb_core/Cargo.toml
[package]
name = "cb_core"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true



[lib]
# 让 cb_core 库可以在 FFI（Android/Windows 外壳）和 CLI 测试中复用
# 只产出 rlib：三个 core-ffi crate 都以静态 rlib 链接 cb_core，没有任何东西加载 cb_core 的 cdylib
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
# ⚠ 不要升到 sha2 0.11：opaque-ke 4.x（含 4.1.0-pre.2）经由 voprf 与这里共用 sha2 0.10，
# 升到 0.11 后其 DefaultCipherSuite 的 Sha512 与 opaque_ke::hash::Hash 不再匹配
# （实测 57 个编译错误）。等 opaque-ke 升到 digest 0.11 生态后再一起升。
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
# ⚠ 不要升到 rand 0.10 / rand_chacha 0.10：ChaCha20Rng 与 OsRng 直接传给 opaque-ke，
# 而 opaque-ke 4.x 要求 rand_core 0.6 的 CryptoRngCore；rand 0.10 用 rand_core 0.9，
# trait 不兼容（实测编译不过）。rand/rand_chacha 只在 OPAQUE 相关路径使用，
# 因此与上游保持同一代更安全。
rand = "0.8.5"
base64 = "0.23"
# --- 网络与异步 (M1) ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
futures = "0.3"

# --- QUIC & TLS (全栈使用 0.23 生态) ---
# quinn 0.11 默认使用 rustls 0.23
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }
# 显式使用 0.23，并开启 ring 特性 (必须，否则 quinn 无法创建默认 provider)
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
# rcgen 0.13 配合 rustls 0.23 使用
rcgen = "0.14.6"

# --- 局域网发现 ---
mdns-sd = "0.21"

opaque-ke = { version = "4.0.1", features = ["std", "serde"] }
# OPAQUE 登录消息（actor.rs）的二进制编码。
# 历史：原本是 bincode 1.3。该项目已永久停止开发 —— RUSTSEC-2025-0141 覆盖**所有**版本
# （实测 2.0.1 依旧触发告警），而 3.0.0 更是只含一行 compile_error! 的"墓碑版本"，
# 因此整体换成 postcard：同样是紧凑二进制 + serde 派生、活跃维护、无已知 advisory。
# **线格式与 bincode 1.x 不兼容**：这是有意的产品决定 —— 不保留与老对端的互通，
# 双方必须运行同一协议版本；将来若需兼容旧版本，必须引入显式的协议版本协商。
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand_chacha = "0.3.1"

# --- 加密与密钥派生 ---
argon2 = "0.6"
ring = "0.17"

[dev-dependencies]
# tempfile 只被测试用到（tests/m1_net.rs、m2_meta.rs），不应出现在 [dependencies]
tempfile = "3.23.0"
