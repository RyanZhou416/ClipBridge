#cb_core/Cargo.toml
[package]
name = "cb_core"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true



[lib]
# 让 cb_core 库可以在 FFI（Android/Windows 外壳）和 CLI 测试中复用
# 只产出 rlib：三个 core-ffi crate 都以静态 rlib 链接 cb_core，没有任何东西加载 cb_core 的 cdylib
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
rand = "0.8.5"
base64 = "0.23"
# --- 网络与异步 (M1) ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
futures = "0.3"

# --- QUIC & TLS (全栈使用 0.23 生态) ---
# quinn 0.11 默认使用 rustls 0.23
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }
# 显式使用 0.23，并开启 ring 特性 (必须，否则 quinn 无法创建默认 provider)
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
# rcgen 0.13 配合 rustls 0.23 使用
rcgen = "0.14.6"

# --- 局域网发现 ---
mdns-sd = "0.21"

opaque-ke = { version = "4.0", features = ["std", "serde"] }
bincode = "1.3"
rand_chacha = "0.3.1"

# --- 加密与密钥派生 ---
argon2 = "0.6"
ring = "0.17"

[dev-dependencies]
# tempfile 只被测试用到（tests/m1_net.rs、m2_meta.rs），不应出现在 [dependencies]
tempfile = "3.23.0"